<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucursales | Laboratorios BIOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/compact.css?v=1783625058">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="../assets/multipage.css?v=1783625058">
    <style>
        #map { min-height: 460px; border-radius: 8px; z-index: 1; }
        .sticky-map-panel { position: sticky; top: 10.25rem; }
        @media (max-width: 767px) { #map { min-height: 340px; } }
        @media (max-width: 1023px) { .sticky-map-panel { position: static; } }
    </style>
    <script src="../assets/site.js?v=1784571500" defer></script>
</head>
<body>
    <div class="page-shell">
        <header class="site-header"></header>

        <main class="page-enter">
            <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14">
                <div class="grid lg:grid-cols-[1fr_420px] gap-6 lg:items-start">
                    <div class="panel p-4 sticky-map-panel">
                        <div id="map"></div>
                    </div>
                    <aside class="grid gap-4 content-start">
                        <div class="dark-panel p-6">
                            <span class="section-kicker !bg-white/10 !border-white/15 !text-cyan-100 mb-5"><i data-lucide="map-pin" class="w-4 h-4"></i> Sucursales</span>
                            <h1 class="brand-type mobile-tight text-4xl font-black leading-none mb-4">Mapa BIOS</h1>
                            <p class="text-blue-100 leading-relaxed">Selecciona una sucursal para centrar el mapa. Tultepec aparece marcada como nueva.</p>
                        </div>
                        <div class="panel p-5">
                            <span class="section-kicker mb-4"><i data-lucide="map-pinned" class="w-4 h-4"></i> Unidad cercana</span>
                            <h2 class="brand-type text-2xl font-black text-[#0A1C2E] mb-2">Busca por código postal</h2>
                            <p class="text-sm text-slate-500 mb-4">Ingresa tu CP para sugerir la unidad más conveniente y abrir la ruta en Google Maps.</p>
                            <div class="grid sm:grid-cols-[1fr_auto] gap-3">
                                <input id="zip-input" class="field" type="text" inputmode="numeric" maxlength="5" placeholder="Ej. 54700">
                                <button id="zip-button" class="primary-button" type="button"><i data-lucide="navigation" class="w-4 h-4"></i> Detectar</button>
                            </div>
                            <div id="zip-result" class="mt-4 hidden rounded-lg border border-blue-100 bg-blue-50 p-4"></div>
                        </div>
                        <figure class="page-visual">
                            <img src="../assets/img/lab-operations.webp" alt="Operación de muestras en unidad BIOS">
                            <figcaption class="visual-caption">
                                <p>Atención por sucursal</p>
                                <p>Encuentra el punto BIOS más cercano.</p>
                            </figcaption>
                        </figure>
                        <div id="branch-list" class="grid gap-3"></div>
                    </aside>
                </div>
            </section>
        </main>
    </div>

    <script>
        const branches = [
            { name: 'Unidad Plaza Cantú', badge: 'Principal', address: 'Av. Dr. Jiménez Cantú S/N, Plaza Cantú Centro Urbano, Cuautitlán Izcalli, C.P. 54700.', phones: ['55-1113-2754', '55-5871-9069'], lat: 19.6695138, lng: -99.2095527, zips: ['54700', '54710', '54720'], mapsUrl: 'https://maps.app.goo.gl/GTkULcomJPVmWa1RA?g_st=aw' },
            { name: 'Unidad Plaza La Joya', badge: 'Alta afluencia', address: 'Melchor Ocampo 31, Villas de Cuautitlán, Cuautitlán, C.P. 54857.', phones: ['55-5872-9277'], lat: 19.6722043, lng: -99.1661641, zips: ['54800', '54830', '54840'], mapsUrl: 'https://maps.app.goo.gl/HCTpiBdM9qtFyWeP6?g_st=aw' },
            { name: 'Unidad Plaza Las Haciendas', badge: 'Cerca de ti', address: 'Av. Huehuetoca S/N, Ex Hacienda de San Miguel, Cuautitlán Izcalli, C.P. 54715.', phones: ['55-5817-3401'], lat: 19.6866634, lng: -99.2099739, zips: ['54740', '54750', '54753'], mapsUrl: 'https://maps.app.goo.gl/trQAczGcXq4uPTNL7?g_st=aw' },
            { name: 'Unidad Tepalcapa', badge: 'Express', address: 'Av. Morelos 9, Luis Echeverría, Cuautitlán Izcalli, C.P. 54753.', phones: ['55-2602-0764'], lat: 19.6205274, lng: -99.2067493, zips: ['54743', '54745', '54760'], mapsUrl: 'https://maps.app.goo.gl/wfzAKYGrhj8kzFr37?g_st=aw' },
            { name: 'Unidad Tepojaco', badge: 'Especialidad', address: 'Av. San Sebastián 56, Ejido de San Francisco Tepojaco, Cuautitlán Izcalli, C.P. 54745.', phones: ['55-5391-8066'], lat: 19.6481325, lng: -99.2585366, zips: ['54770', '54783', '54784'], mapsUrl: 'https://maps.app.goo.gl/owmpJRdZXaLPeEEJ9?g_st=aw' },
            { name: 'Unidad Tultepec', badge: 'Nueva', isNew: true, address: 'Plaza Tauro, Av. Joaquín Montenegro 95, San Martín, Tultepec, C.P. 54960.', phones: ['55-9413-2041'], lat: 19.6736413, lng: -99.1283153, zips: ['54960', '54963', '54964'], mapsUrl: 'https://maps.app.goo.gl/NY95gD25q4Ge9czK8?g_st=aw' }
        ];
        const map = L.map('map', { scrollWheelZoom: false }).setView([19.66, -99.20], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '&copy; CARTO' }).addTo(map);
        const markers = [];

        function focusBranch(index) {
            const branch = branches[index];
            map.flyTo([branch.lat, branch.lng], 15, { duration: 1.1 });
            markers[index].openPopup();
        }

        function mapsUrl(branch) {
            return branch.mapsUrl;
        }

        function popupMarkup(branch) {
            return `
                <div class="bios-map-popup">
                    <p class="bios-map-popup-kicker">${branch.badge}</p>
                    <strong>${branch.name}</strong>
                    <span>${branch.address}</span>
                    <a href="${mapsUrl(branch)}" target="_blank" rel="noopener">
                        <i class="fa-solid fa-route"></i> Ir con Google Maps
                    </a>
                </div>
            `;
        }

        function nearestByZip(zip) {
            const exact = branches.find(branch => branch.zips.includes(zip));
            if (exact) return exact;
            const numericZip = Number(zip);
            if (!Number.isFinite(numericZip)) return branches[0];
            return branches.reduce((best, branch) => {
                const branchDistance = Math.min(...branch.zips.map(item => Math.abs(Number(item) - numericZip)));
                const bestDistance = Math.min(...best.zips.map(item => Math.abs(Number(item) - numericZip)));
                return branchDistance < bestDistance ? branch : best;
            }, branches[0]);
        }

        function detectByZip() {
            const zip = document.getElementById('zip-input').value.replace(/\D/g, '').slice(0, 5);
            const result = document.getElementById('zip-result');
            if (zip.length !== 5) {
                result.classList.remove('hidden');
                result.innerHTML = '<p class="font-black text-[#0A1C2E]">Ingresa un código postal de 5 dígitos.</p>';
                return;
            }
            const branch = nearestByZip(zip);
            const index = branches.indexOf(branch);
            focusBranch(index);
            result.classList.remove('hidden');
            result.innerHTML = `
                <p class="text-xs uppercase tracking-[0.18em] font-black text-blue-700 mb-1">Unidad sugerida</p>
                <h3 class="brand-type text-xl font-black text-[#0A1C2E]">${branch.name}</h3>
                <p class="text-sm text-slate-600 mt-1">${branch.address}</p>
                <a class="primary-button mt-3" target="_blank" rel="noopener" href="${mapsUrl(branch)}"><i data-lucide="route" class="w-4 h-4"></i> Ir con Google Maps</a>
            `;
            lucide.createIcons();
        }

        document.getElementById('branch-list').innerHTML = branches.map((branch, index) => `
            <article class="panel branch-route-card p-4 hover:border-blue-300 transition">
                <button type="button" class="branch-route-main text-left" onclick="focusBranch(${index})">
                    <div class="flex items-start justify-between gap-3 mb-2">
                        <h2 class="brand-type text-xl font-black text-[#0A1C2E]">${branch.name}</h2>
                        <span class="${branch.isNew ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-100'} border rounded-full px-3 py-1 text-[10px] uppercase tracking-[0.18em] font-black">${branch.badge}</span>
                    </div>
                    <p class="text-sm text-slate-500 mb-3">${branch.address}</p>
                    <div class="flex flex-wrap gap-2">${branch.phones.map(phone => `<span class="text-xs font-black bg-slate-50 border border-slate-200 rounded-full px-3 py-1">${phone}</span>`).join('')}</div>
                </button>
                <div class="branch-route-actions">
                    <button type="button" class="secondary-button !min-h-10 !px-3 !py-2" onclick="focusBranch(${index})"><i data-lucide="map-pin" class="w-4 h-4"></i> Ver</button>
                    <a class="map-route-button" target="_blank" rel="noopener" href="${mapsUrl(branch)}"><i data-lucide="route" class="w-4 h-4"></i> Ir</a>
                </div>
            </article>
        `).join('');

        branches.forEach((branch, index) => {
            const marker = L.marker([branch.lat, branch.lng]).addTo(map);
            marker.bindPopup(popupMarkup(branch), { className: 'bios-leaflet-popup', minWidth: 230 });
            markers.push(marker);
        });

        document.getElementById('zip-button').addEventListener('click', detectByZip);
        document.getElementById('zip-input').addEventListener('keydown', event => {
            if (event.key === 'Enter') detectByZip();
        });

        lucide.createIcons();
    </script>
</body>
</html>
