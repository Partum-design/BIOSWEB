<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Laboratorios BIOS">
  <title>Laboratorios BIOS</title>
  <!--
    Símbolo de marca: el globo con el pulso, sobre una pastilla con el
    degradado azul BIOS. La pastilla es lo que hace que el icono se vea
    igual de nítido en una pestaña clara, en una oscura o sobre cualquier
    color: el contraste vive dentro del icono, no depende del fondo.
    Geometría espejo de tools/build_favicon.py (versiones PNG e ICO).
  -->
  <defs>
    <linearGradient id="biosBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1C2E"/>
      <stop offset="0.55" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#29B6F6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14.4" ry="14.4" fill="url(#biosBadge)"/>

  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="20.16" stroke-width="4.48"/>
    <ellipse cx="32" cy="32" rx="8.96" ry="20.16" stroke-width="2.88" stroke-opacity="0.67"/>
  </g>

  <!-- El pulso lleva funda azul profunda para no fundirse con el aro. -->
  <path d="M3.52 32 H20.48 L24.64 32 L28.29 18.24 L33.28 47.04 L37.63 27.52 L41.28 32.77 L44.8 32 H60.48"
        fill="none" stroke="#0A1C2E" stroke-opacity="0.57" stroke-width="8.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M3.52 32 H20.48 L24.64 32 L28.29 18.24 L33.28 47.04 L37.63 27.52 L41.28 32.77 L44.8 32 H60.48"
        fill="none" stroke="#FFFFFF" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
